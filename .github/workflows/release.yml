name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  publish:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DevToolsManager.App/DevToolsManager.App.csproj --locked-mode

      - name: Publish linux-x64
        run: |
          dotnet publish DevToolsManager.App/DevToolsManager.App.csproj \
            /p:PublishProfile=linux-x64 \
            /p:PublishSingleFile=true \
            -c Release

      - name: Publish win-x64
        run: |
          dotnet publish DevToolsManager.App/DevToolsManager.App.csproj \
            /p:PublishProfile=win-x64 \
            /p:PublishSingleFile=true \
            -c Release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          make_latest: true
          files: |
            publish/linux-x64/DevToolsManager
            publish/win-x64/DevToolsManager.exe
