name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without leading v (e.g. 1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Normalize version
        id: ver
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: |
          dotnet restore DevToolsManager.App/DevToolsManager.App.csproj --locked-mode

      - name: Publish linux-x64
        run: |
          dotnet publish DevToolsManager.App/DevToolsManager.App.csproj \
            /p:PublishProfile=linux-x64 \
            /p:PublishSingleFile=true \
            -c Release \
            --no-restore

      - name: Publish win-x64
        run: |
          dotnet publish DevToolsManager.App/DevToolsManager.App.csproj \
            /p:PublishProfile=win-x64 \
            /p:PublishSingleFile=true \
            -c Release \
            --no-restore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.value }}
          name: v${{ steps.ver.outputs.value }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            publish/linux-x64/DevToolsManager
            publish/win-x64/DevToolsManager.exe
